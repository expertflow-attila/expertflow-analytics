name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fios
          POSTGRES_PASSWORD: fios
          POSTGRES_DB: fios_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://fios:fios@localhost:5432/fios_test
      TEST_DATABASE_URL: postgres://fios:fios@localhost:5432/fios_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-value-not-used-in-production
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
