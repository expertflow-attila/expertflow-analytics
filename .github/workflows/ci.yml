name: CI
on:
  pull_request:
  push:
    branches: [main, codex/phase-1-foundation]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://funnel:funnel@localhost:5432/funnel_intelligence
      AUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

