services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: funnel_intelligence
      POSTGRES_USER: funnel
      POSTGRES_PASSWORD: funnel
    ports:
      - "5432:5432"
    volumes:
      - funnel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funnel -d funnel_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  funnel_postgres_data:

